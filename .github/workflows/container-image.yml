name: Build and publish container image

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: container-image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Build linux/amd64 image
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      # CUDA, PyTorch, and audio-model layers are large. Removing unrelated
      # runner SDKs leaves enough local storage for BuildKit snapshots.
      - name: Reclaim runner disk space
        shell: bash
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup
          docker image prune --all --force
          df -h /

      - name: Set lowercase GHCR image name
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Sign in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          flavor: latest=false
          tags: |
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=ref,event=tag
          labels: |
            org.opencontainers.image.title=NeoVideoLingo
            org.opencontainers.image.description=NeoVideoLingo Streamlit runtime with PyTorch and CUDA

      # The PyTorch base image currently publishes linux/amd64 only. Docker
      # media types retain HEALTHCHECK metadata and remain pullable by Podman.
      - name: Build and push image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          sbom: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=videolingo-amd64
          cache-to: type=gha,mode=max,scope=videolingo-amd64,ignore-error=true

      - name: Publish build summary
        shell: bash
        run: |
          {
            echo "### Container image published"
            echo
            echo "- Image: \`${{ steps.image.outputs.name }}\`"
            echo "- Tags: \`latest\`, \`${{ github.ref_name }}\`"
            echo "- Digest: \`${{ steps.build.outputs.digest }}\`"
            echo
            echo '```bash'
            echo "podman pull ${{ steps.image.outputs.name }}:latest"
            echo "podman pull ${{ steps.image.outputs.name }}:${{ github.ref_name }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
